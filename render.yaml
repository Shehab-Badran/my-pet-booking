databases:
  - name: my-pet-center-db
    databaseName: mypetcenter
    user: mypetcenter_user
    plan: free

services:
  - type: web
    name: my-pet-center
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "python -m backend.app.seed && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-pet-center-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mypetcenter.com
      - key: ADMIN_PHONE
        value: "01200888841"
      - key: ADMIN_PASSWORD
        value: "MyPetCenter#2026!Admin"
      - key: PYTHONPATH
        value: "."
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "My Pet Center"
