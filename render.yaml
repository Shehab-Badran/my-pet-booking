databases:
  - name: my-pet-center-db
    databaseName: mypetcenter
    user: mypetcenter_user
    plan: free

services:
  - type: web
    name: my-pet-center
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-pet-center-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mypetcenter.com
      - key: ADMIN_PHONE
        value: "01200888841"
      - key: ADMIN_PASSWORD
        value: "MyPetCenter#2026!Admin"
      - key: PYTHONPATH
        value: "."
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "My Pet Center"
